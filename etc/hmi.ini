; HMI-T113S4 运行时配置，安装到板端 /etc/hmi.ini
; 应用以 root 运行，配置只读；桌面 Kit 调试时文件不存在则全部走默认值。
; 注意：QSettings 只支持整行注释，值后面不要跟行内注释。

[ui]
; 全局字号 pt，只设字号，字体族由 fontconfig(wqy-zenhei) 决定
fontSize=16
; LogPanel 只读，限 500 行
logMaxLines=500
; 命令行 --windowed 可临时覆盖
fullScreen=true

[process]
; ProcessRunner 命令超时，硬范围 3000–5000 ms
timeoutMs=4000
