; HMI-T113S4 运行时配置，安装到板端 /etc/hmi.ini
; 应用以 root 运行，配置只读；桌面 Kit 调试时文件不存在则全部走默认值。
; 注意：QSettings 只支持整行注释，值后面不要跟行内注释。

[ui]
; 全局字号，单位是像素（px），只设字号，字体族由 fontconfig(wqy-zenhei) 决定
; 不要写 pt：板端 7 寸屏物理 DPI 约 130-190，pt 会被换算放大到撑破控件
; 800x480 下 17px 密度合适；可调范围 12–32
fontSize=17
; LogPanel 只读，限 500 行
logMaxLines=500
; 命令行 --windowed 可临时覆盖
fullScreen=true

[process]
; ProcessRunner 命令超时，硬范围 3000–5000 ms
timeoutMs=4000

[wifi]
; 扫描倒计时秒数：点「扫描」后等这么多秒再去取结果，同时把这串秒数显示在状态行。
; 为什么需要倒计时：wpa_cli scan 只是「触发扫描」，立刻查 scan_results 会读到
; 上一轮的旧列表。这块板整轮扫描实测约 1.7s，留到 5s 有充分余量。
; 可调范围 2–30；写 0 或非法值按 5 处理。
; 调小能更快出结果，但小于实际扫描耗时会出现「列表是上一次的」。
scanSeconds=5
; WiFi 驱动日志等级（对应 wifi -D 的参数）。
;
; 为什么需要它：AIC8800 驱动默认往内核日志打大量 AICWFDBG(LOGTRACE/LOGDEBUG)，
; 这些日志经 klogd -> syslogd 落到 /var/log/messages。本板 /var/log 是指向
; /tmp 的软链接，所以实际写进 /tmp/messages —— 既吃 tmpfs 内存又刷屏串口。
;
; 取值：error / warn / info / debug / dump / open / close
;   error  只打错误（推荐，默认）
;   warn   警告及以上
;   info   常规信息
;   debug  调试（会很吵）
;   open/close  控制是否打印 path/file/line 前缀
;
; 注意：这个等级只影响驱动自己的打印，不影响 wifi / wpa_cli 返回的数据。
; 扫描能不能拿到 SSID、连接能不能成功，与它无关。
logLevel=error

[web]
; 局域网网页文件管理：手机扫码即可浏览/上传/下载/删除文件
; 监听端口，被占用时自动顺延尝试后 10 个
port=8080
; 访问令牌：留空 = 只靠同局域网隔离；填任意字符串则必须带 ?k=<token> 访问
token=
; 可访问目录白名单（逗号分隔），只有真实存在的目录会生效
; 生产环境请勿把 / 加进来：本程序以 root 运行
roots=/usr,/tmp,/var,/opt,/media
; 开机自启（false 则需在「网页管理」页手动启动）
autostart=true

[upgrade]
; U 盘升级：包目录名，包放在 <挂载点>/<packageDir>/ 下
packageDir=hmi-upgrade
; 候选挂载根（逗号分隔）。留空 = 自动扫描：
;   Linux  读 /proc/mounts 里的 /dev/sd* 与 mmcblk 挂载点
;   Windows 取非 C: 的可移动卷
; 桌面调试没有 U 盘时，可临时填一个普通目录当"U 盘"，例如 D:/hmi-usb
roots=
