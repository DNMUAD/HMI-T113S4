; HMI-T113S4 运行时配置，安装到板端 /etc/hmi.ini
; 应用以 root 运行，配置只读；桌面 Kit 调试时文件不存在则全部走默认值。
; 注意：QSettings 只支持整行注释，值后面不要跟行内注释。

[ui]
; 全局字号 pt，只设字号，字体族由 fontconfig(wqy-zenhei) 决定
; 1024x600 上 14pt 密度合适；觉得偏小可调到 16（上限 24）
fontSize=14
; LogPanel 只读，限 500 行
logMaxLines=500
; 命令行 --windowed 可临时覆盖
fullScreen=true

[process]
; ProcessRunner 命令超时，硬范围 3000–5000 ms
timeoutMs=4000

[web]
; 局域网网页文件管理：手机扫码即可浏览/上传/下载/删除文件
; 监听端口，被占用时自动顺延尝试后 10 个
port=8080
; 访问令牌：留空 = 只靠同局域网隔离；填任意字符串则必须带 ?k=<token> 访问
token=
; 可访问目录白名单（逗号分隔），只有真实存在的目录会生效
; 生产环境请勿把 / 加进来：本程序以 root 运行
roots=/mnt/usb,/media,/usr/share,/tmp
; 开机自启（false 则需在「网页管理」页手动启动）
autostart=true

[upgrade]
; U 盘升级：包目录名，包放在 <挂载点>/<packageDir>/ 下
packageDir=hmi-upgrade
; 候选挂载根（逗号分隔）。留空 = 自动扫描：
;   Linux  读 /proc/mounts 里的 /dev/sd* 与 mmcblk 挂载点
;   Windows 取非 C: 的可移动卷
; 桌面调试没有 U 盘时，可临时填一个普通目录当"U 盘"，例如 D:/hmi-usb
roots=
